# One command: docker compose up --build
# API reference: http://localhost:8080/scalar
name: helpdesk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk-local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-helpdesk-app-local}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The API works as helpdesk_app, bound by row-level security; only migrations use the owner.
      ConnectionStrings__Helpdesk: "Host=db;Database=helpdesk;Username=helpdesk_app;Password=${APP_DB_PASSWORD:-helpdesk-app-local}"
      ConnectionStrings__Migrations: "Host=db;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD:-helpdesk-local}"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-signing-key-change-me-in-the-env-file-0123456789}
      Auth__AttemptsPerMinute: ${AUTH_ATTEMPTS_PER_MINUTE:-10}
    volumes:
      - attachments:/data/attachments
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  attachments:
